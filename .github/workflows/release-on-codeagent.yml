name: Release codeagent VSIX

on:
  workflow_dispatch: 
  push:
    branches:
      - codeagent

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: make vsix

      - name: Find generated VSIX
        id: find_vsix
        run: |
          set -e
          vsix=$(ls -1 *.vsix 2>/dev/null | head -n1 || true)
          if [ -z "$vsix" ]; then
            echo "No .vsix found."
            exit 1
          fi
          echo "vsix_name=$vsix" >> $GITHUB_OUTPUT
          echo "vsix_path=$PWD/$vsix" >> $GITHUB_OUTPUT

      - name: Build timestamp and release name
        id: timestamp
        run: |
          ts_human=$(date -u '+%Y-%m-%d %H-%M')
          # fixed label chosen by you
          label="codeagent"
          release_name="${ts_human} ${label}"
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          # Use commit SHA as tag_name to avoid creating a new human-readable tag
          echo "tag_name=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.timestamp.outputs.tag_name }}
          release_name: ${{ steps.timestamp.outputs.release_name }}
          body: "Release created by workflow on branch codeagent. Commit: ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_vsix.outputs.vsix_path }}
          asset_name: ${{ steps.find_vsix.outputs.vsix_name }}
          asset_content_type: application/octet-stream
